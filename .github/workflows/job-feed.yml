name: job-feed

on:
  schedule:
    # 11:00 UTC, weekday mornings
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, filter, and write the feed
        run: python src/run.py

      - name: Commit the feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json state/seen.json
          if git diff --staged --quiet; then
            echo "No feed changes — nothing to commit."
            exit 0
          fi
          git commit -m "job-feed: refresh candidates ($(date -u +%Y-%m-%d))"
          git push
