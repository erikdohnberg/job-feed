name: job-feed

on:
  schedule:
    # 06:00 UTC daily = 02:00 Toronto during EDT, 01:00 during EST.
    # GitHub cron is UTC only and does not follow daylight saving.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, filter, write the feed, and push to Notion
        run: python src/run.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Commit the feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json state/seen.json
          if git diff --staged --quiet; then
            echo "No feed changes — nothing to commit."
            exit 0
          fi
          git commit -m "job-feed: refresh candidates ($(date -u +%Y-%m-%d))"
          git push
